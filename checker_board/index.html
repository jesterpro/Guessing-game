<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkerboard Game</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>CHECKERBOARD GAME</h1>

    <div class="board">

        <!-- Row 1 -->
        <div class="row">
            <div class="square"></div>
            <div class="square"><span class="piece black"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece black"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece black"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece black"></span></div>
        </div>

        <!-- Row 2 -->
        <div class="row">
            <div class="square"><span class="piece black"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece black"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece black"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece black"></span></div>
            <div class="square"></div>
        </div>

        <!-- Row 3 -->
        <div class="row">
            <div class="square"></div>
            <div class="square"><span class="piece black"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece black"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece black"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece black"></span></div>
        </div>

        <!-- Row 4 -->
        <div class="row">
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
        </div>

        <!-- Row 5 -->
        <div class="row">
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
        </div>

        <!-- Row 6 -->
        <div class="row">
            <div class="square"><span class="piece red"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece red"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece red"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece red"></span></div>
            <div class="square"></div>
        </div>

        <!-- Row 7 -->
        <div class="row">
            <div class="square"></div>
            <div class="square"><span class="piece red"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece red"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece red"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece red"></span></div>
        </div>

        <!-- Row 8 -->
        <div class="row">
            <div class="square"><span class="piece red"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece red"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece red"></span></div>
            <div class="square"></div>
            <div class="square"><span class="piece red"></span></div>
            <div class="square"></div>
        </div>

    </div>

</body>
</html>
